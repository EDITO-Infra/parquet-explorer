name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src/backend/Cargo.toml --all -- --check
      - run: cargo check --manifest-path src/backend/Cargo.toml --locked
      - run: cargo test --manifest-path src/backend/Cargo.toml --locked
      - run: cargo clippy --manifest-path src/backend/Cargo.toml --all-targets --locked -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: src/frontend
      - run: npm run build
        working-directory: src/frontend
