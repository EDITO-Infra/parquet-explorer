services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      PV_CORS_ORIGINS: http://localhost:3000
      PV_ALLOWED_SOURCE_SCHEMES: https,http
      PV_ALLOW_PRIVATE_NETWORKS: "false"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
