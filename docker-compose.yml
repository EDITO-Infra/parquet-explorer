version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parquet-viewer-backend
    ports:
      - "8080:8080"
    environment:
      PV_APP_ENV: production
      PV_MAX_ROWS: 10000
      PV_QUERY_TIMEOUT_S: 30
      PV_DUCKDB_MEMORY_LIMIT: 2GB
      PV_DUCKDB_THREADS: 4
      PV_TILE_SERVICE_URL: http://tile-service:8090
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - parquet-viewer

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: parquet-viewer-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - parquet-viewer

  tile-service:
    build:
      context: .
      dockerfile: Dockerfile.tile-rust
    container_name: parquet-viewer-tile-service
    ports:
      - "8090:8090"
    environment:
      TILE_BIND: 0.0.0.0:8090
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - parquet-viewer

networks:
  parquet-viewer:
    driver: bridge
