[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-viewer"
version = "0.1.0"
description = "Parquet explorer API for EDITO with DuckDB and pluggable map tile service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
	{ name = "EDITO" }
]
dependencies = [
	"fastapi>=0.115.0",
	"uvicorn[standard]>=0.30.0",
	"duckdb>=1.1.0",
	"pydantic>=2.8.0",
	"pydantic-settings>=2.3.0",
	"httpx>=0.27.0",
	"pytz>=2025.2",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.3.0",
	"ruff>=0.6.0",
	"mypy>=1.11.0"
]

[tool.setuptools]
package-dir = {"" = "src/backend"}

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
