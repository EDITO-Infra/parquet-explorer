[package]
name = "parquet-viewer-backend"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Native Rust Arrow/GeoParquet backend for Parquet Viewer"

[dependencies]
arrow = "59.2.0"
anyhow = "1.0"
arrow-array = "59.2.0"
arrow-ipc = "59.2.0"
arrow-schema = "59.2.0"
axum = "0.8.9"
bytes = "1.10"
futures = "0.3"
http = "1.3"
object_store = { version = "0.13.2", features = ["aws", "azure", "gcp", "http"] }
parking_lot = "0.12"
parquet = { version = "59.2.0", features = ["arrow", "async", "geospatial"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
